<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Julián Narváez - Redireccionando...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 to index.html with query path
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #090a0f; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <p>Redireccionando al portafolio...</p>
  </body>
</html>
