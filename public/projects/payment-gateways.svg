<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="line-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-pg)"/>
  <rect width="800" height="450" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0c1527"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="400" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Banco de Alimentos Quito • Pipeline Transaccional &amp; CRM Sync</text>

  <!-- Node 1: Payment Gateways (Nacional & Int.) -->
  <rect x="50" y="150" width="180" height="150" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="140" cy="190" r="22" fill="#1e3a8a"/>
  <text x="140" y="196" fill="#60a5fa" font-family="sans-serif" font-size="18" text-anchor="middle">💳</text>
  <text x="140" y="235" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pasarelas de Pago</text>
  <text x="140" y="254" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Nacionales e Int.</text>
  <rect x="80" y="270" width="120" height="18" rx="9" fill="#1e293b"/>
  <text x="140" y="283" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Webhooks Activos</text>

  <!-- Connection Line 1 to 2 -->
  <line x1="230" y1="225" x2="310" y2="225" stroke="url(#line-flow)" stroke-width="3" stroke-dasharray="6"/>
  <circle cx="270" cy="225" r="5" fill="#10b981"/>

  <!-- Node 2: Core Full Stack API & Security Validation -->
  <rect x="310" y="120" width="200" height="210" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <circle cx="410" cy="165" r="24" fill="#064e3b"/>
  <text x="410" y="172" fill="#34d399" font-family="sans-serif" font-size="20" text-anchor="middle">⚙️</text>
  <text x="410" y="210" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">API REST &amp; Core Hub</text>
  <text x="410" y="230" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Validación Criptográfica</text>
  
  <rect x="330" y="250" width="160" height="24" rx="6" fill="#1e293b"/>
  <text x="410" y="266" fill="#a5b4fc" font-family="monospace" font-size="10" text-anchor="middle">Payload Sanitization</text>
  <rect x="330" y="282" width="160" height="24" rx="6" fill="#1e293b"/>
  <text x="410" y="298" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Signature Verified ✓</text>

  <!-- Connection Line 2 to 3 -->
  <line x1="510" y1="225" x2="570" y2="225" stroke="url(#line-flow)" stroke-width="3" stroke-dasharray="6"/>
  <circle cx="540" cy="225" r="5" fill="#6366f1"/>

  <!-- Node 3: CRM System & Analytics -->
  <rect x="570" y="150" width="180" height="150" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <circle cx="660" cy="190" r="22" fill="#312e81"/>
  <text x="660" y="196" fill="#a5b4fc" font-family="sans-serif" font-size="18" text-anchor="middle">📊</text>
  <text x="660" y="235" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Sincronización CRM</text>
  <text x="660" y="254" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Gestión de Donaciones</text>
  <rect x="600" y="270" width="120" height="18" rx="9" fill="#1e293b"/>
  <text x="660" y="283" fill="#a5b4fc" font-family="monospace" font-size="10" text-anchor="middle">Live Sync 100%</text>

  <!-- Metrics Banner at bottom -->
  <rect x="50" y="360" width="700" height="54" rx="8" fill="#070c18" stroke="#1e293b"/>
  <text x="80" y="392" fill="#64748b" font-family="sans-serif" font-size="11">MÉTRICAS DEL SISTEMA:</text>
  <text x="240" y="392" fill="#10b981" font-family="monospace" font-size="12">99.9% Uptime</text>
  <text x="360" y="392" fill="#38bdf8" font-family="monospace" font-size="12">&lt;120ms Latencia</text>
  <text x="500" y="392" fill="#f59e0b" font-family="monospace" font-size="12">Cero Pérdida de Eventos</text>
  <text x="660" y="392" fill="#a5b4fc" font-family="monospace" font-size="12">Scrum Agile</text>
</svg>
