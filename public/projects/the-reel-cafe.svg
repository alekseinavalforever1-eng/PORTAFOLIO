  <text x="44" y="112" fill="#64748b" font-family="sans-serif" font-size="11">Jersey Web Services + JPA ORM</text>

  <!-- Code Snippet Box -->
  <rect x="40" y="130" width="228" height="272" rx="8" fill="#070c18" stroke="#1e293b"/>
  <text x="52" y="156" fill="#38bdf8" font-family="monospace" font-size="11">@Path("/api/movies")</text>
  <text x="52" y="176" fill="#f8fafc" font-family="monospace" font-size="11">public class MovieResource {</text>
  <text x="64" y="198" fill="#a5b4fc" font-family="monospace" font-size="11">@GET @Produces(JSON)</text>
  <text x="64" y="218" fill="#f1f5f9" font-family="monospace" font-size="11">public Response getAll() {</text>
  <text x="76" y="238" fill="#10b981" font-family="monospace" font-size="11">return Factory.getDao()</text>
  <text x="88" y="258" fill="#10b981" font-family="monospace" font-size="11">.findAllMovies();</text>
  <text x="64" y="278" fill="#f1f5f9" font-family="monospace" font-size="11">}</text>
  <text x="52" y="300" fill="#64748b" font-family="monospace" font-size="11">// JPA EntityManager</text>
  <text x="52" y="322" fill="#64748b" font-family="monospace" font-size="11">// MySQL Persistence</text>
  <rect x="52" y="340" width="204" height="42" rx="6" fill="#1e293b"/>
  <circle cx="70" cy="361" r="5" fill="#10b981"/>
  <text x="86" y="365" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">200 OK • JSON Encoded</text>

  <!-- Right Main Area: Movie Application Interface -->
  <rect x="302" y="60" width="474" height="366" rx="12" fill="#0f172a" stroke="#1e293b"/>
  
  <!-- Search and Header inside app -->
  <rect x="322" y="80" width="260" height="32" rx="6" fill="#070c18" stroke="#1e293b"/>
  <text x="336" y="101" fill="#64748b" font-family="sans-serif" font-size="11">🔍 Buscar películas o reseñas...</text>
  
  <rect x="660" y="80" width="96" height="32" rx="6" fill="#2563eb"/>
  <text x="708" y="101" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Nueva Reseña</text>

