  <text x="400" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">The Reel Cafe • Java 17 • JAX-RS Jersey • JPA</text>

  <!-- Left Sidebar: Backend Architecture & Factory Pattern -->
  <rect x="24" y="60" width="260" height="366" rx="12" fill="#0f172a" stroke="#1e293b"/>
